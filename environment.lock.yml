# Solved, test-verified environment for CaliciTyper. NOT hand-edited.
#
# Written by benchmarking/slurm/make_env_lock.sh after `pytest tests/`
# passed in this exact environment:
#   125 passed, 13 deselected, 4 warnings in 131.16s (0:02:11)
#   platform linux-64, python 3.12, 2026-11-20
#   calicityper ed0384e on main
#
# Use it to reproduce a run exactly:
#   conda env create -n calicityper-locked -f environment.lock.yml
# environment.yml stays the bounded spec to install from normally, and
# CI keeps resolving 3.10 and 3.12 fresh so upstream breakage still shows.
# Exported --no-builds: versions pinned, build strings left out so the
# file is not tied to one package build.
