[project]
name = "norotyper"
version = "0.3.0"
description = "Command-line norovirus genotyping following the RIVM typing tool method"
requires-python = ">=3.9"
dependencies = ["biopython", "numpy", "pandas"]
[project.optional-dependencies]
fast = ["numba"]
test = ["pytest"]
[project.scripts]
norotyper = "norotyper.cli:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["norotyper"]
