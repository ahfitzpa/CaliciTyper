[project]
name = "calicityper"
version = "0.7.0"
description = "CaliciTyper: command-line typing for Caliciviridae"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amy Fitzpatrick" }]
dependencies = ["biopython", "numpy", "pandas"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]
[project.optional-dependencies]
fast = ["numba"]
report = ["bokeh"]
test = ["pytest", "bokeh"]
[project.urls]
Homepage = "https://github.com/ahfitzpa/calicityper"
[project.scripts]
calicityper = "calicityper.cli:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["calicityper"]
# false, or setuptools sweeps everything inside the package directory into the
# wheel -- including the Zenodo-distributed reference set, which is deliberately
# untracked but still present in a working tree.
include-package-data = false

[tool.setuptools.package-data]
# The reference set is NOT shipped in the wheel: it is a Zenodo dataset
# (doi:10.5281/zenodo.24161236) fetched by `calicityper setup`. Only the small
# text files the package needs to find and verify it travel with the code.
calicityper = [
  "data/putative_novel_bounds.tsv",
  "data/reference_accessions.tsv",
  "data/reference_manifest.json",
]

[tool.pytest.ini_options]
# The end-to-end recombination tests drive OpenRDP over a 7.2 kb x 9 alignment,
# which measured at ~50 min per dataset (job 1126058). They are therefore
# marked slow and deselected by default; run them as a batch job:
#   pytest -m slow tests/test_recomb.py
markers = ["slow: needs OpenRDP and runs for tens of minutes per dataset"]
addopts = "-m 'not slow'"
