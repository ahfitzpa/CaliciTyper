[project]
name = "calicityper"
version = "0.6.1"
description = "CaliciTyper: command-line typing for Caliciviridae"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amy Fitzpatrick" }]
dependencies = ["biopython", "numpy", "pandas"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]
[project.optional-dependencies]
fast = ["numba"]
report = ["bokeh"]
test = ["pytest", "bokeh"]
[project.urls]
Homepage = "https://github.com/ahfitzpa/calicityper"
[project.scripts]
calicityper = "calicityper.cli:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["calicityper"]

# The reference data lives inside the package so that it is installed with the
# code; without this a wheel would contain only the .py files and the tool
# could not run outside a source checkout.
[tool.setuptools.package-data]
calicityper = [
  "data/database/*",
  "data/reference_sequences_RdRp/*",
  "data/reference_sequences_VP1/*",
  "data/putative_novel_bounds.tsv",
]

[tool.pytest.ini_options]
# The end-to-end recombination tests drive OpenRDP over a 7.2 kb x 9 alignment,
# which measured at ~50 min per dataset (job 1126058). They are therefore
# marked slow and deselected by default; run them as a batch job:
#   pytest -m slow tests/test_recomb.py
markers = ["slow: needs OpenRDP and runs for tens of minutes per dataset"]
addopts = "-m 'not slow'"
