[project]
name = "calicityper"
version = "0.8.1"
description = "CaliciTyper: command-line typing for Caliciviridae"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amy Fitzpatrick" }]
# Floors are the oldest releases that support requires-python and provide the
# APIs used (Bio.Align.PairwiseAligner with substitution_matrices; the NumPy 2
# scalar and copy semantics the distance code relies on). Ceilings are the next
# major: unbounded dependencies let a new upstream major turn CI red with no
# code change, which is what these pins are for. Raise a ceiling only after CI
# has run against that major. environment.lock.yml carries one solved,
# test-verified set of versions for reproducing a run exactly.
dependencies = [
  "biopython>=1.81,<2",
  "numpy>=2.0,<3",
  "pandas>=2.0,<4",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]
[project.optional-dependencies]
fast = ["numba>=0.59,<1"]
report = ["bokeh>=3.1,<4"]
test = ["pytest>=7.4,<10", "bokeh>=3.1,<4"]
[project.urls]
Homepage = "https://github.com/ahfitzpa/CaliciTyper"
Repository = "https://github.com/ahfitzpa/CaliciTyper"
Issues = "https://github.com/ahfitzpa/CaliciTyper/issues"
Changelog = "https://github.com/ahfitzpa/CaliciTyper/blob/main/CHANGELOG.md"
[project.scripts]
calicityper = "calicityper.cli:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["calicityper"]
# false, or setuptools sweeps everything inside the package directory into the
# wheel -- including the Zenodo-distributed reference set, which is deliberately
# untracked but still present in a working tree.
include-package-data = false

[tool.setuptools.package-data]
# Reference set is distributed via Zenodo (doi:10.5281/zenodo.24354774) and fetched by `calicityper setup`.
calicityper = [
  "data/gii4_antigenic_sites.tsv",
  "data/gii4_coevolving_pairs.tsv",
  "data/gii4_variant_references.tsv",
  "data/immunotype_regime.tsv",
  "data/putative_novel_bounds.tsv",
  "data/reference_accessions.tsv",
  "data/reference_manifest.json",
]

[tool.pytest.ini_options]
# The end-to-end recombination tests drive OpenRDP over a 7.2 kb x 9 alignment,
# which measured at ~50 min per dataset (job 1126058). They are therefore
# marked slow and deselected by default; run them as a batch job:
#   pytest -m slow tests/test_recomb.py
markers = ["slow: needs OpenRDP and runs for tens of minutes per dataset"]
addopts = "-m 'not slow'"
