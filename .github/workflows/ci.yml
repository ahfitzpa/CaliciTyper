name: CI

# Runs on every push and pull request. Its job is to prove that a clean
# machine can install calicityper and type a sequence correctly -- this is what
# catches a dependency release breaking the tool for other people, which a
# working laptop or cluster never notices.
on:
  push:
    branches: [main, rivm-replication]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install BLAST, MAFFT and Python via conda
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: calicityper-ci
          create-args: >-
            python=${{ matrix.python-version }}
            blast
            mafft
            numpy
            pandas
            biopython
            bokeh
            pytest
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: Fetch and verify the reference set
        shell: bash -el {0}
        run: |
          pip install -e .
          calicityper setup --in-package
          calicityper setup --verify-only --in-package

      - name: Install calicityper
        shell: bash -el {0}
        run: pip install -e ".[test]"

      - name: Unit and CLI tests
        shell: bash -el {0}
        run: pytest tests/ -v

      - name: Check the wheel is small and does NOT carry the reference set
        shell: bash -el {0}
        run: |
          pip wheel . --no-deps -w /tmp/wh
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("/tmp/wh/calicityper-*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          heavy = [n for n in names if n.startswith("calicityper/data/database/")
                   or n.startswith("calicityper/data/reference_sequences_")]
          need = ["calicityper/data/reference_manifest.json",
                  "calicityper/data/reference_accessions.tsv",
                  "calicityper/data/putative_novel_bounds.tsv"]
          missing = [n for n in need if n not in names]
          assert not heavy, f"wheel still carries the reference set: {heavy[:5]}"
          assert not missing, f"wheel is missing manifest files: {missing}"
          print(f"OK: wheel carries {len(names)} files and no reference sequences")
          PY

      - name: End-to-end typing of a known genome
        shell: bash -el {0}
        run: |
          python - <<'PY'
          from Bio import SeqIO
          rs = list(SeqIO.parse("calicityper/data/database/refseq_2.fasta", "fasta"))
          SeqIO.write(rs[:2], "ci_query.fa", "fasta")
          PY
          calicityper type ci_query.fa -o ci_out.tsv --threads 2
          cat ci_out.tsv
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("ci_out.tsv"), delimiter="\t"))
          assert len(rows) == 2, rows
          assert all(r["genogroup"] == "GI" for r in rows), rows
          assert all(float(r["orf2_support"] or 0) >= 70 for r in rows), rows
          print("OK:", [(r["query"], r["orf1_type"], r["orf2_type"]) for r in rows])
          PY
