# Development/runtime convenience environment for working from this repository.
# Core Python package dependencies are declared in pyproject.toml ([project].dependencies
# and optional extras: fast=numba, report=bokeh, test=pytest,bokeh). Keep overlapping
# package intent/versions in sync when updating either file.
# This file also includes non-Python/system tools (blast, mafft, clustalw, iqtree,
# entrez-direct) and dev/test utilities not expressed as PyPI package deps.
#
# Reproducibility: this is a convenience spec, not a lock file. CI validates a
# baseline on ubuntu-latest with Python 3.10/3.12 using conda-forge+bioconda
# packages (see .github/workflows/ci.yml) but does not pin exact builds here.
# For reproducible installs, pin/export resolved versions (e.g.
# `conda env export -n calicityper > environment.lock.yml` or micromamba
# equivalent) or use a container image. For OpenRDP (calicityper recomb), use a
# separate pinned environment due to numpy<2 constraints (see README).
name: calicityper
channels: [conda-forge, bioconda]
dependencies:
  - python>=3.10
  - numpy
  - pandas
  - biopython
  - blast          # genogroup assignment
  - mafft          # aligns queries onto the pre-aligned references (default backend)
  - clustalw       # only for the legacy --backend clustalw path
  - iqtree         # ML trees for the putative-novel 2x SD screen (Chhabra et al. use PhyML)
  - numba          # optional: ~10x faster bootstrap (pure-numpy fallback if absent)
  - bokeh         # figures in the HTML report (--html / --report)
  - entrez-direct  # only for scripts/fetch_rivm_test_set.sh (RIVM comparison set)
  - pytest
  - pip
  - pip:
      - -e .
